name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/desktop/package.json
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Determine build and release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source and version history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Detect desktop version change
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const path = "apps/desktop/package.json";
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const manual = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
          const tagged = !manual && process.env.GITHUB_REF_TYPE === "tag";
          let version = JSON.parse(readFileSync(path, "utf8")).version;
          let changed = false;

          if (tagged) {
            version = process.env.GITHUB_REF_NAME.slice(1);
          } else if (!manual && event.before && !/^0+$/.test(event.before)) {
            const previous = JSON.parse(execFileSync("git", ["show", `${event.before}:${path}`], { encoding: "utf8" }));
            changed = previous.version !== version;
          }

          // Keep version strings safe for filenames and workflow outputs.
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Invalid desktop release version: ${version}`);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, [
            `build=${manual || tagged || changed}`,
            `release=${tagged || changed}`,
            `version=${version}`,
            `tag=v${version}`,
            "",
          ].join("\n"));
          console.log(changed ? `Desktop version changed to ${version}` : `Desktop version: ${version}`);
          NODE

  ci:
    name: Checks
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-26
            platform: mac
            arch: arm64
            artifact: macos-arm64
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Set app build version
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm version "$APP_VERSION" \
            --workspace=@tenderlayer/desktop \
            --no-git-tag-version --ignore-scripts --allow-same-version

      # The root make task builds the desktop workspace before invoking electron-builder.
      # No signing or notarization credentials are configured.
      - name: Build unsigned installers
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: npm run make -- -- "--$BUILD_PLATFORM" "--$BUILD_ARCH"

      - name: Smoke test packaged app and database upgrades
        run: node apps/desktop/scripts/smoke-test.mjs

      - name: Collect installers
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'NODE'
          import { copyFileSync, mkdirSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const windows = process.env.BUILD_PLATFORM === "win";
          const output = "apps/desktop/out";
          const files = readdirSync(output, { withFileTypes: true })
            .filter((entry) => entry.isFile())
            .map((entry) => entry.name);
          const required = windows ? [".exe"] : [".dmg", ".zip"];
          mkdirSync("release", { recursive: true });

          for (const type of required) {
            const matches = files.filter((file) => file.endsWith(type));
            if (matches.length === 0) throw new Error(`Missing ${type} artifact`);
            for (const file of matches) {
              copyFileSync(join(output, file), join("release", file));
            }
          }
          for (const file of files.filter((file) => file.endsWith(".blockmap"))) {
            copyFileSync(join(output, file), join("release", file));
          }
          NODE

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: tenderlayer-${{ matrix.artifact }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish release
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, ci, build]
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: tenderlayer-*-${{ github.run_number }}
          merge-multiple: true
          path: release

      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          # Build metadata does not determine whether a version is a pre-release.
          version_without_metadata="${RELEASE_TAG%%+*}"
          prerelease=false
          if [[ "$version_without_metadata" == *-* ]]; then
            prerelease=true
          fi

          if tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Release tag already points to a different commit; use a new version"
              exit 1
            fi
          fi
          if is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; keeping existing assets"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease="$prerelease" --target "$GITHUB_SHA" --title "TenderLayer $RELEASE_TAG" \
              --notes "Unsigned testing builds for macOS Apple Silicon (arm64) and Windows (x64). The macOS build is not notarized. Windows users upgrading from alpha.3 or earlier should uninstall the previous Squirrel installation before installing this NSIS build to avoid duplicate installations."
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft=false --prerelease="$prerelease"
